<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Instrument Sans", system-ui, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #3f3f46 0%, #18181b 45%, #09090b 100%);
            color: #fafafa;
            padding: 24px;
        }

        main {
            width: min(100%, 28rem);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: rgba(24, 24, 27, 0.9);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 16px;
            color: #d4d4d8;
            line-height: 1.5;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 700;
            background: #fafafa;
            color: #18181b;
        }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>The mobile shell is still available, but this page could not be refreshed. Reconnect to sync your latest data.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
